name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test.mjs tests/rawbytes.ts tests/models.ts tests/t3ce.ts tests/calibration.ts tests/trigger.ts tests/curveidentity.ts tests/clean-profile.ts tests/dynamic.ts tests/curveadjust.ts tests/review.ts tests/dotoncurve.ts tests/axisscale.ts tests/leadjoy.ts tests/leadjoy-session.ts tests/sharecode.ts tests/community.ts tests/shiftlayer.ts tests/hyperstrike.ts
      # Create the draft up front: the installer and portable targets publish
      # in parallel and otherwise each create their own draft for the tag.
      - run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --draft --title "Stick Labs $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes " " }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifacts publish via electron-builder's `publish` config in
      # package.json (both exes land on the Release). Tag must match the
      # package.json version, e.g. tag v1.0.0 with version 1.0.0.
